[misc]
disable = ["mas", "gem", "ruby_gems", "pip3", "yarn", "asdf"]
assume_yes = true

[git]
arguments = "--rebase --autostash"
repos = ["~/.config/nvim", "~/.fzf/fzf-git.sh"]

[containers]
ignored_containers = ["ngen-*", "otel-test-*"]

[pre_commands]
# retired ollama cloud models leave unpullable stubs that break the ollama step
"Prune retired Ollama models" = "$HOME/bin/ollama-prune-retired"

[commands]
"lazy.nvim plugins" = 'nvim --headless "+Lazy! sync" +qa'
"Brew upgrade HEAD" = "HOMEBREW_NO_INSTALL_CLEANUP=1 brew upgrade --fetch-HEAD"
# "Wezterm nightly" = "HOMEBREW_NO_INSTALL_CLEANUP=1 brew upgrade --cask wezterm-nightly --no-quarantine --greedy-latest"
"gh extensions upgrade" = "gh extension upgrade --all"
"tuicr upgrade" = "cargo install tuicr"
